version: "3.8"

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: abwqyevs1-
      POSTGRES_DB: omovie
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build: ./backend
    restart: always
    environment:
      PG_URL: postgres://postgres:abwqyevs1-@db:5432/omovie
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  db_data:
